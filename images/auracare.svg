<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg-grad2)" />
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Mockup Container -->
  <g filter="url(#shadow2)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#FFFFFF" />
    <!-- Header bar -->
    <rect x="50" y="40" width="700" height="45" rx="12" fill="#0284C7" />
    <circle cx="75" cy="62" r="5" fill="#EF4444" />
    <circle cx="92" cy="62" r="5" fill="#F59E0B" />
    <circle cx="109" cy="62" r="5" fill="#10B981" />
    <text x="135" y="67" font-family="sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">+ AuraCare Medical Dashboard</text>
    
    <!-- Top Stat Cards -->
    <g transform="translate(80, 105)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="190" height="85" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="28" font-family="sans-serif" font-size="12" fill="#64748B">Total Patients Today</text>
      <text x="16" y="58" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0284C7">328</text>
      <rect x="130" y="18" width="45" height="18" rx="4" fill="#E0F2FE" />
      <text x="136" y="31" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369A1">Active</text>

      <!-- Card 2 -->
      <rect x="225" y="0" width="190" height="85" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="241" y="28" font-family="sans-serif" font-size="12" fill="#64748B">Appointments</text>
      <text x="241" y="58" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0F172A">64 Scheduled</text>

      <!-- Card 3 -->
      <rect x="450" y="0" width="190" height="85" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="466" y="28" font-family="sans-serif" font-size="12" fill="#64748B">Available Doctors</text>
      <text x="466" y="58" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10B981">18 On Duty</text>
    </g>

    <!-- Main Chart & Patient Queue Split -->
    <g transform="translate(80, 210)">
      <!-- Left Chart Box -->
      <rect x="0" y="0" width="380" height="230" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Patient Admissions Trend</text>
      <!-- Chart line SVG graphic -->
      <path d="M 30 180 Q 90 120, 150 140 T 270 70 T 350 90" fill="none" stroke="#0284C7" stroke-width="3" />
      <!-- Area under chart -->
      <path d="M 30 180 Q 90 120, 150 140 T 270 70 T 350 90 L 350 200 L 30 200 Z" fill="#E0F2FE" opacity="0.5" />
      <circle cx="270" cy="70" r="5" fill="#0284C7" />
      
      <!-- Right Doctors Queue Box -->
      <rect x="400" y="0" width="240" height="230" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="415" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Doctor Schedule</text>
      
      <rect x="415" y="45" width="210" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="425" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Dr. Sarah Jenkins</text>
      <text x="425" y="80" font-family="sans-serif" font-size="10" fill="#64748B">Cardiology • 10:30 AM</text>
      
      <rect x="415" y="100" width="210" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="425" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Dr. Robert Chen</text>
      <text x="425" y="135" font-family="sans-serif" font-size="10" fill="#64748B">Neurology • 11:15 AM</text>

      <rect x="415" y="155" width="210" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="425" y="175" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A">Dr. Emily Adams</text>
      <text x="425" y="190" font-family="sans-serif" font-size="10" fill="#64748B">Pediatrics • 01:00 PM</text>
    </g>
  </g>
</svg>
