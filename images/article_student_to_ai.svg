<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad4)" />

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Orbs -->
  <circle cx="200" cy="180" r="140" fill="#06b6d4" opacity="0.15" filter="blur(45px)" />
  <circle cx="600" cy="270" r="160" fill="#3b82f6" opacity="0.14" filter="blur(50px)" />

  <!-- Main Card -->
  <rect x="140" y="70" width="520" height="310" rx="20" fill="#1e293b" stroke="rgba(6,182,212,0.3)" stroke-width="2" filter="url(#shadow4)" />

  <!-- Window Header -->
  <rect x="140" y="70" width="520" height="42" rx="20" fill="#0f172a" />
  <circle cx="170" cy="91" r="6" fill="#ef4444" />
  <circle cx="190" cy="91" r="6" fill="#f59e0b" />
  <circle cx="210" cy="91" r="6" fill="#06b6d4" />
  <text x="400" y="96" fill="#94a3b8" font-size="14" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">student_to_ai_engineer_roadmap.py</text>

  <!-- Step Progression Bar -->
  <g transform="translate(180, 160)">
    <!-- Milestone 1 -->
    <rect width="110" height="60" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <text x="55" y="28" fill="#94a3b8" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">2023–2024</text>
    <text x="55" y="46" fill="#ffffff" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" text-anchor="middle">B.Tech CSE</text>

    <!-- Connector 1 -->
    <path d="M 110 30 L 140 30" stroke="#06b6d4" stroke-width="3" />

    <!-- Milestone 2 -->
    <rect x="140" y="0" width="120" height="60" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="200" y="28" fill="#06b6d4" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">2025–2026</text>
    <text x="200" y="46" fill="#ffffff" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" text-anchor="middle">AI &amp; Flowgen</text>

    <!-- Connector 2 -->
    <path d="M 260 30 L 290 30" stroke="#3b82f6" stroke-width="3" />

    <!-- Milestone 3 -->
    <rect x="290" y="0" width="130" height="60" rx="12" fill="url(#cyanGlow)" />
    <text x="355" y="28" fill="#ffffff" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">2027 CAREER</text>
    <text x="355" y="46" fill="#ffffff" font-size="13" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">AI Engineer</text>
  </g>

  <!-- Growth Line Chart -->
  <g transform="translate(180, 270)">
    <path d="M 0 60 L 140 40 L 270 20 L 420 0" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="60" r="6" fill="#94a3b8" />
    <circle cx="140" cy="40" r="6" fill="#06b6d4" />
    <circle cx="270" cy="20" r="6" fill="#3b82f6" />
    <circle cx="420" cy="0" r="8" fill="#ffffff" stroke="#06b6d4" stroke-width="3" />
    <text x="420" y="-14" fill="#06b6d4" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">Production Systems</text>
  </g>
</svg>
