<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg-grad4)" />
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Mockup Container -->
  <g filter="url(#shadow4)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#FFFFFF" />
    <!-- Header -->
    <rect x="50" y="40" width="700" height="45" rx="12" fill="#78350F" />
    <circle cx="75" cy="62" r="5" fill="#EF4444" />
    <circle cx="92" cy="62" r="5" fill="#F59E0B" />
    <circle cx="109" cy="62" r="5" fill="#10B981" />
    <text x="135" y="67" font-family="sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">🏛 Interior Vision • Architecture &amp; Living</text>
    
    <!-- Gallery Showcase Grid -->
    <g transform="translate(80, 105)">
      <!-- Left Big Feature Image Container -->
      <rect x="0" y="0" width="380" height="320" rx="8" fill="#FDE68A" />
      <!-- Minimalist Room Mockup Vector -->
      <path d="M 0 220 L 380 220 L 380 320 L 0 320 Z" fill="#D97706" />
      <rect x="40" y="100" width="140" height="120" rx="6" fill="#F59E0B" opacity="0.6" />
      <rect x="220" y="150" width="120" height="70" rx="4" fill="#92400E" />
      <circle cx="280" cy="110" r="25" fill="#FEF3C7" opacity="0.8" />
      <text x="20" y="40" font-family="sans-serif" font-weight="bold" font-size="18" fill="#78350F">Nordic Minimalist Lounge</text>
      <text x="20" y="60" font-family="sans-serif" font-size="12" fill="#92400E">Residential Project • Stockholm</text>

      <!-- Right Column Stack -->
      <rect x="400" y="0" width="240" height="150" rx="8" fill="#FED7AA" />
      <text x="415" y="30" font-family="sans-serif" font-weight="bold" font-size="14" fill="#78350F">Modern Kitchen Oasis</text>
      <text x="415" y="48" font-family="sans-serif" font-size="11" fill="#92400E">Marble &amp; Walnut Finishes</text>
      
      <rect x="400" y="170" width="240" height="150" rx="8" fill="#FEF3C7" />
      <text x="415" y="200" font-family="sans-serif" font-weight="bold" font-size="14" fill="#78350F">Penthouse Suite</text>
      <text x="415" y="218" font-family="sans-serif" font-size="11" fill="#92400E">Panoramic Skylight Architecture</text>
    </g>
  </g>
</svg>
