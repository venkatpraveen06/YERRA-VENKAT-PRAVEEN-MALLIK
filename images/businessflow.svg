<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg-grad6)" />
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Mockup Container -->
  <g filter="url(#shadow6)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#FFFFFF" />
    <!-- Header -->
    <rect x="50" y="40" width="700" height="45" rx="12" fill="#0F172A" />
    <circle cx="75" cy="62" r="5" fill="#EF4444" />
    <circle cx="92" cy="62" r="5" fill="#F59E0B" />
    <circle cx="109" cy="62" r="5" fill="#10B981" />
    <text x="135" y="67" font-family="sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">⚡ BusinessFlow AI Automation Platform</text>
    
    <!-- Automation Node Workflow Flowchart Mockup -->
    <g transform="translate(80, 105)">
      <!-- Left Trigger Node -->
      <rect x="0" y="50" width="160" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
      <rect x="15" y="65" width="24" height="24" rx="4" fill="#2563EB" />
      <text x="48" y="82" font-family="sans-serif" font-weight="bold" font-size="13" fill="#1E40AF">WhatsApp Lead</text>
      <text x="48" y="98" font-family="sans-serif" font-size="10" fill="#3B82F6">Trigger: New Message</text>

      <!-- Connecting line 1 -->
      <line x1="160" y1="90" x2="230" y2="90" stroke="#2563EB" stroke-width="3" stroke-dasharray="4" />
      <circle cx="195" cy="90" r="4" fill="#2563EB" />

      <!-- Middle AI Processor Node -->
      <rect x="230" y="50" width="180" height="80" rx="8" fill="url(#glow-grad)" />
      <text x="250" y="82" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">Gemini AI Agent</text>
      <text x="250" y="98" font-family="sans-serif" font-size="10" fill="#E0E7FF">Extract Intent &amp; Qualify Lead</text>

      <!-- Connecting line 2 -->
      <line x1="410" y1="90" x2="480" y2="90" stroke="#10B981" stroke-width="3" />

      <!-- Right CRM Action Node -->
      <rect x="480" y="50" width="160" height="80" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2" />
      <text x="495" y="82" font-family="sans-serif" font-weight="bold" font-size="13" fill="#065F46">PostgreSQL CRM</text>
      <text x="495" y="98" font-family="sans-serif" font-size="10" fill="#10B981">Auto-Create Lead Record</text>
    </g>

    <!-- Bottom Analytics Bar -->
    <g transform="translate(80, 260)">
      <rect x="0" y="0" width="640" height="170" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="20" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Real-time Automation Performance</text>
      
      <rect x="20" y="50" width="180" height="95" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="35" y="75" font-family="sans-serif" font-size="11" fill="#64748B">Leads Processed Today</text>
      <text x="35" y="105" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2563EB">1,492</text>
      <text x="35" y="125" font-family="sans-serif" font-size="10" fill="#10B981">⚡ 99.8% Auto-qualified</text>

      <rect x="230" y="50" width="180" height="95" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="245" y="75" font-family="sans-serif" font-size="11" fill="#64748B">Avg Response Time</text>
      <text x="245" y="105" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0F172A">1.2s</text>
      <text x="245" y="125" font-family="sans-serif" font-size="10" fill="#2563EB">Instant WhatsApp API</text>

      <rect x="440" y="50" width="180" height="95" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="455" y="75" font-family="sans-serif" font-size="11" fill="#64748B">Hours Saved / Month</text>
      <text x="455" y="105" font-family="sans-serif" font-size="24" font-weight="bold" fill="#10B981">240 hrs</text>
      <text x="455" y="125" font-family="sans-serif" font-size="10" fill="#059669">ROI: 14x Cost Saved</text>
    </g>
  </g>
</svg>
