<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="337" x2="800" y2="337" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Orbs -->
  <circle cx="250" cy="200" r="150" fill="#25d366" opacity="0.15" filter="blur(45px)" />
  <circle cx="550" cy="250" r="160" fill="#38bdf8" opacity="0.12" filter="blur(50px)" />

  <!-- Main Workflow Card Window -->
  <rect x="140" y="70" width="520" height="310" rx="20" fill="#1e293b" stroke="rgba(37,211,102,0.3)" stroke-width="2" filter="url(#shadow2)" />
  
  <!-- Window Header -->
  <rect x="140" y="70" width="520" height="42" rx="20" fill="#0f172a" />
  <circle cx="170" cy="91" r="6" fill="#ef4444" />
  <circle cx="190" cy="91" r="6" fill="#f59e0b" />
  <circle cx="210" cy="91" r="6" fill="#25d366" />
  <text x="400" y="96" fill="#94a3b8" font-size="14" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">n8n_whatsapp_lead_automation.json</text>

  <!-- Step 1: Customer Chat Bubble -->
  <g transform="translate(180, 160)">
    <rect width="110" height="60" rx="12" fill="#0f172a" stroke="#25d366" stroke-width="2" />
    <text x="55" y="28" fill="#25d366" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">Incoming</text>
    <text x="55" y="46" fill="#ffffff" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">WhatsApp Msg</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 300 190 L 340 190" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4,2" />

  <!-- Step 2: n8n Workflow Engine -->
  <g transform="translate(350, 150)">
    <rect width="110" height="80" rx="16" fill="url(#greenGlow)" />
    <text x="55" y="36" fill="#ffffff" font-size="14" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">n8n Workflow</text>
    <text x="55" y="56" fill="#e2e8f0" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">AI Lead Scoring</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 470 190 L 510 190" stroke="#38bdf8" stroke-width="3" />

  <!-- Step 3: Supabase CRM Sync -->
  <g transform="translate(520, 160)">
    <rect width="110" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="55" y="28" fill="#38bdf8" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">Supabase</text>
    <text x="55" y="46" fill="#ffffff" font-size="11" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">CRM Synced</text>
  </g>

  <!-- Status Metric Pill -->
  <g transform="translate(280, 285)">
    <rect width="240" height="46" rx="23" fill="#0f172a" stroke="#25d366" stroke-width="2" />
    <circle cx="310" cy="308" r="7" fill="#25d366" />
    <text x="400" y="313" fill="#ffffff" font-size="13" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" text-anchor="middle">Response Time &lt; 5 seconds (24/7)</text>
  </g>
</svg>
