<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#311b92" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)" />

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Orbs -->
  <circle cx="220" cy="200" r="140" fill="#a855f7" opacity="0.16" filter="blur(45px)" />
  <circle cx="580" cy="260" r="150" fill="#38bdf8" opacity="0.14" filter="blur(50px)" />

  <!-- Main Card -->
  <rect x="140" y="70" width="520" height="310" rx="20" fill="#1e293b" stroke="rgba(168,85,247,0.3)" stroke-width="2" filter="url(#shadow3)" />

  <!-- Window Header -->
  <rect x="140" y="70" width="520" height="42" rx="20" fill="#0f172a" />
  <circle cx="170" cy="91" r="6" fill="#ef4444" />
  <circle cx="190" cy="91" r="6" fill="#f59e0b" />
  <circle cx="210" cy="91" r="6" fill="#a855f7" />
  <text x="400" y="96" fill="#94a3b8" font-size="14" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">nlp_transformer_attention_matrix.py</text>

  <!-- Waveform Line -->
  <path d="M 180 240 Q 230 140, 280 240 T 380 240 T 480 240 T 580 240 T 620 240" fill="none" stroke="url(#purpleGlow)" stroke-width="3" stroke-linecap="round" />

  <!-- NLP Token Boxes -->
  <g transform="translate(190, 150)">
    <rect width="90" height="40" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="45" y="25" fill="#ffffff" font-size="12" font-family="Fira Code, monospace" text-anchor="middle">[Token_1]</text>
  </g>

  <g transform="translate(300, 150)">
    <rect width="90" height="40" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="45" y="25" fill="#ffffff" font-size="12" font-family="Fira Code, monospace" text-anchor="middle">[Attention]</text>
  </g>

  <g transform="translate(410, 150)">
    <rect width="90" height="40" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="45" y="25" fill="#ffffff" font-size="12" font-family="Fira Code, monospace" text-anchor="middle">[PyTorch]</text>
  </g>

  <g transform="translate(520, 150)">
    <rect width="90" height="40" rx="8" fill="url(#purpleGlow)" />
    <text x="45" y="25" fill="#ffffff" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">94%+ Acc</text>
  </g>

  <!-- Classification Bar Metrics -->
  <g transform="translate(200, 290)">
    <text x="0" y="0" fill="#94a3b8" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="700">Toxicity Score:</text>
    <rect x="100" y="-10" width="280" height="12" rx="6" fill="#0f172a" />
    <rect x="100" y="-10" width="260" height="12" rx="6" fill="#a855f7" />
    <text x="400" y="0" fill="#a855f7" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800">94% Safe</text>
  </g>
</svg>
