<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg-grad5)" />
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Mockup Container -->
  <g filter="url(#shadow5)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#FFFFFF" />
    <!-- Header -->
    <rect x="50" y="40" width="700" height="45" rx="12" fill="#0D9488" />
    <circle cx="75" cy="62" r="5" fill="#EF4444" />
    <circle cx="92" cy="62" r="5" fill="#F59E0B" />
    <circle cx="109" cy="62" r="5" fill="#10B981" />
    <text x="135" y="67" font-family="sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">🏢 Smart Hostel Management Portal</text>

    <!-- Room Allocation Matrix Mockup -->
    <g transform="translate(80, 105)">
      <!-- Top Metrics -->
      <rect x="0" y="0" width="190" height="70" rx="8" fill="#CCFBF1" />
      <text x="15" y="25" font-family="sans-serif" font-size="11" fill="#0F766E">Occupancy Rate</text>
      <text x="15" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0D9488">94% Occupied</text>

      <rect x="210" y="0" width="190" height="70" rx="8" fill="#F0FDF4" />
      <text x="225" y="25" font-family="sans-serif" font-size="11" fill="#166534">Monthly Fee Collection</text>
      <text x="225" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#15803D">$42,500 Collected</text>

      <rect x="420" y="0" width="220" height="70" rx="8" fill="#FEF2F2" />
      <text x="435" y="25" font-family="sans-serif" font-size="11" fill="#991B1B">Open Maintenance Complaints</text>
      <text x="435" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#DC2626">3 Resolved Today</text>
    </g>

    <!-- Room Grid -->
    <g transform="translate(80, 195)">
      <text x="0" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Block A Room Status</text>
      
      <!-- Rooms -->
      <g transform="translate(0, 35)">
        <rect x="0" y="0" width="115" height="90" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
        <text x="12" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">Room 101</text>
        <text x="12" y="45" font-family="sans-serif" font-size="10" fill="#15803D">Occupied (2/2)</text>
        <rect x="12" y="58" width="90" height="18" rx="4" fill="#DCFCE7" />
        <text x="24" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#166534">Fees Clear</text>

        <rect x="130" y="0" width="115" height="90" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
        <text x="142" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">Room 102</text>
        <text x="142" y="45" font-family="sans-serif" font-size="10" fill="#15803D">Occupied (2/2)</text>
        <rect x="142" y="58" width="90" height="18" rx="4" fill="#DCFCE7" />
        <text x="154" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#166534">Fees Clear</text>

        <rect x="260" y="0" width="115" height="90" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" />
        <text x="272" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991B1B">Room 103</text>
        <text x="272" y="45" font-family="sans-serif" font-size="10" fill="#DC2626">Occupied (1/2)</text>
        <rect x="272" y="58" width="90" height="18" rx="4" fill="#FEE2E2" />
        <text x="282" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#991B1B">Pending Fee</text>

        <rect x="390" y="0" width="115" height="90" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
        <text x="402" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#166534">Room 104</text>
        <text x="402" y="45" font-family="sans-serif" font-size="10" fill="#15803D">Occupied (2/2)</text>

        <rect x="520" y="0" width="120" height="90" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4" />
        <text x="532" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748B">Room 105</text>
        <text x="532" y="45" font-family="sans-serif" font-size="10" fill="#94A3B8">Vacant (0/2)</text>
        <rect x="532" y="58" width="95" height="18" rx="4" fill="#E2E8F0" />
        <text x="548" y="71" font-family="sans-serif" font-size="9" font-weight="bold" fill="#475569">Available</text>
      </g>
    </g>
