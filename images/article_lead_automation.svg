<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skyGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad5)" />

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Orbs -->
  <circle cx="220" cy="190" r="140" fill="#38bdf8" opacity="0.14" filter="blur(45px)" />
  <circle cx="580" cy="270" r="150" fill="#2563eb" opacity="0.15" filter="blur(50px)" />

  <!-- Main Card -->
  <rect x="140" y="70" width="520" height="310" rx="20" fill="#1e293b" stroke="rgba(56,189,248,0.3)" stroke-width="2" filter="url(#shadow5)" />

  <!-- Window Header -->
  <rect x="140" y="70" width="520" height="42" rx="20" fill="#0f172a" />
  <circle cx="170" cy="91" r="6" fill="#ef4444" />
  <circle cx="190" cy="91" r="6" fill="#f59e0b" />
  <circle cx="210" cy="91" r="6" fill="#38bdf8" />
  <text x="400" y="96" fill="#94a3b8" font-size="14" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">automated_lead_followup_pipeline.py</text>

  <!-- Funnel & Conversion Graphics -->
  <g transform="translate(180, 150)">
    <!-- Top Visitor Bar -->
    <rect width="440" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="220" y="23" fill="#ffffff" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" text-anchor="middle">Website Visitor Inquiries</text>
  </g>

  <g transform="translate(220, 205)">
    <!-- Qualification Step -->
    <rect width="360" height="36" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
    <text x="180" y="23" fill="#38bdf8" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" text-anchor="middle">n8n Webhook &amp; AI Lead Scoring</text>
  </g>

  <g transform="translate(260, 260)">
    <!-- Automated Follow-up Trigger -->
    <rect width="280" height="42" rx="10" fill="url(#skyGlow)" />
    <text x="140" y="26" fill="#ffffff" font-size="13" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">85%+ Open Rate Follow-Up</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(200, 325)">
    <text x="0" y="0" fill="#25d366" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800">✓ 24/7 Drip Sequence</text>
    <text x="200" y="0" fill="#38bdf8" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800">✓ Supabase CRM Sync</text>
  </g>
</svg>
