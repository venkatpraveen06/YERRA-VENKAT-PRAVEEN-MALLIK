<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="blur(40px)" />
  <circle cx="600" cy="280" r="160" fill="#2563eb" opacity="0.15" filter="blur(50px)" />

  <!-- Central Tech Card Window -->
  <rect x="150" y="75" width="500" height="300" rx="16" fill="#1e293b" stroke="rgba(56,189,248,0.3)" stroke-width="2" filter="url(#shadow1)" />
  
  <!-- Window Header Bar -->
  <rect x="150" y="75" width="500" height="40" rx="16" fill="#0f172a" />
  <circle cx="180" cy="95" r="6" fill="#ef4444" />
  <circle cx="200" cy="95" r="6" fill="#f59e0b" />
  <circle cx="220" cy="95" r="6" fill="#38bdf8" />
  <text x="400" y="100" fill="#94a3b8" font-size="14" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" text-anchor="middle">ai_fastapi_model.py — Python 3.11</text>

  <!-- Neural Net Nodes & Connection Lines -->
  <path d="M 220 220 L 320 160 L 480 200 L 580 150" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
  <path d="M 220 220 L 320 280 L 480 200 L 580 300" stroke="#2563eb" stroke-width="2" opacity="0.8" />

  <!-- Node Circles -->
  <circle cx="220" cy="220" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="320" cy="160" r="16" fill="#2563eb" stroke="#ffffff" stroke-width="3" />
  <circle cx="320" cy="280" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="480" cy="200" r="20" fill="url(#blueGlow)" stroke="#ffffff" stroke-width="3" />
  <circle cx="580" cy="150" r="14" fill="#0f172a" stroke="#2563eb" stroke-width="3" />
  <circle cx="580" cy="300" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />

  <!-- Python Icon Shape -->
  <g transform="translate(370, 240)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="8" fill="#38bdf8" font-size="28" font-family="Fira Code, monospace" font-weight="800" text-anchor="middle">Py</text>
  </g>

  <!-- Floating Badges -->
  <g transform="translate(200, 330)">
    <rect width="110" height="32" rx="16" fill="#2563eb" opacity="0.9" />
    <text x="55" y="21" fill="#ffffff" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" text-anchor="middle">FastAPI</text>
  </g>
  
  <g transform="translate(490, 100)">
    <rect width="130" height="32" rx="16" fill="#38bdf8" opacity="0.9" />
    <text x="65" y="21" fill="#0f172a" font-size="12" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" text-anchor="middle">Hugging Face</text>
  </g>
</svg>
